<!-- Base layout template -->
<!-- Provides common HTML structure, global styles, and content block -->
<!DOCTYPE html>
<html class="dark">
    <head>
        <title>MK WEB</title>
        <!-- Load Django static files (CSS, JS, images) -->
        {% load static %}
        <!-- Global compiled CSS (Tailwind output) -->
        <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
        <link rel="manifest" href="{% static 'site.webmanifest' %}">
    </head>
    <!-- Page body -->
    <body class="bg-[#003D5B]">
        {% if messages %}
        <div class="fixed top-6 left-1/2 -translate-x-1/2 z-50 w-full max-w-lg px-4">
            <div class="flex flex-col gap-3">
                {% for message in messages %}
                    <div
                        class="rounded-2xl px-6 py-5 text-base font-semibold shadow-2xl border
                        {% if message.tags == 'success' %}
                            bg-green-600 text-white border-green-400
                        {% elif message.tags == 'error' %}
                            bg-red-600 text-white border-red-400
                        {% elif message.tags == 'warning' %}
                            bg-yellow-500 text-black border-yellow-300
                        {% else %}
                            bg-blue-600 text-white border-blue-400
                        {% endif %}
                        ">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        </div>
        {% endif %}
        {% if request.user.is_authenticated and request.resolver_match.url_name != 'home' %}
            <header class="top-8 z-40 mt-6">
                <div class="max-w-5xl xl:max-w-6xl mx-auto px-4 mb-2">
                    <div class="rounded-2xl px-4 h-14 flex items-center justify-between">
                        <!-- Center navigation -->
                        <nav class="flex items-center gap-2">
                            <a href="{% url 'home' %}"
                               class="px-4 py-2 rounded-xl bg-[#30638E] text-white/80 text-base font-semibold hover:bg-[#003D5B]/60 transition">
                                Dashboard
                            </a>
                            <a href="{% url 'invoice_list' %}"
                               class="px-4 py-2 rounded-xl bg-[#30638E] text-white text-base font-semibold hover:bg-[#003D5B]/60 transition">
                                Faktúry
                            </a>
                            <a href="{% url 'entities:entity_list' %}"
                               class="px-4 py-2 rounded-xl bg-[#30638E] text-white/80 text-base font-semibold hover:bg-[#003D5B]/60 transition">
                                Subjekty
                            </a>
                        </nav>
                        <!-- Logout (right) -->
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit"
                                    title="Odhlásiť sa"
                                    aria-label="Odhlásiť sa"
                                    class="px-4 py-2 rounded-xl bg-[#30638E] flex items-center justify-center text-[#EDAE49] hover:bg-[#003D5B]/70 focus:outline-none focus:ring-2 focus:ring-[#EDAE49] cursor-pointer">
                                ⎋ Odhlásiť sa
                            </button>
                        </form>
                    </div>
                </div>
            </header>
        {% endif %}
        <!-- Main page content will be injected here -->
        {% block content %}{% endblock %}
    </body>
</html>
