{% extends "base.html" %}

{% block content %}

<div class="mx-auto mt-6 max-w-5xl px-4 pb-12 xl:max-w-6xl">

    <!-- HEADER -->
    <div
        class="
            mb-6
            rounded-3xl
            border border-[#66B7C2]
            bg-[#E5F6F7]
            p-8
            shadow-sm
        "
    >

        <h1
            class="
                text-center
                text-3xl
                font-bold
                tracking-tight
                text-[#66B7C2]
                md:text-4xl
            "
        >
            VŠEMBA
        </h1>

    </div>


    <!-- EMPTY STATE -->
    <div
        class="
            rounded-3xl
            border border-[#4E8BC9]
            bg-[#E7F0F8]
            px-6
            py-14
            text-center
            shadow-sm
        "
    >

        <p
            class="
                text-lg
                font-semibold
                text-[#4E8BC9]
            "
        >
            Zatiaľ tu nie sú žiadne projekty.
        </p>

    </div>


    <!-- COLOR PALETTE -->
    <div class="mt-6 grid grid-cols-5 gap-2">

        <div class="h-2 rounded-full bg-[#F2A15F]"></div>
        <div class="h-2 rounded-full bg-[#D88CB5]"></div>
        <div class="h-2 rounded-full bg-[#66B7C2]"></div>
        <div class="h-2 rounded-full bg-[#4E8BC9]"></div>
        <div class="h-2 rounded-full bg-[#F27C73]"></div>

    </div>

</div>

{% endblock %}
