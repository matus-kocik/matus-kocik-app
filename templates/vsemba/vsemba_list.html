{% extends "base.html" %}

{% block content %}

<div class="mx-auto mt-6 max-w-5xl px-4 pb-12 xl:max-w-6xl">

    <!-- HEADER -->
    <div
        class="
            mb-6
            rounded-3xl
            border border-[#66B7C2]
            bg-[#E5F6F7]
            p-8
            shadow-sm
        "
    >

        <h1
            class="
                text-center
                text-3xl
                font-bold
                tracking-tight
                text-[#66B7C2]
                md:text-4xl
            "
        >
            VŠEMBA
        </h1>

    </div>


    <!-- PROJECTS -->
    <div class="space-y-6">

        <!-- ORANGE - RODOKMEŇ EKONÓMIE -->
        <article
            class="
                rounded-2xl
                border border-[#F2A15F]
                bg-[#FFF1E5]
                p-6
                shadow-sm
                transition-all
                duration-200
                hover:-translate-y-0.5
                hover:shadow-md
            "
        >

            <a
                href="{% url 'rodokmen:rodokmen' %}"
                class="block"
            >

                <h2
                    class="
                        mb-2
                        text-2xl
                        font-bold
                        tracking-tight
                        text-[#D8782C]
                        md:text-3xl
                    "
                >
                    Rodokmeň ekonómie
                </h2>

                <p class="leading-relaxed text-[#4F5963]">
                    Vývoj ekonomického myslenia, ekonomických škôl,
                    osobností a ich vzájomných súvislostí.
                </p>

            </a>

        </article>

    </div>


    <!-- COLOR PALETTE -->
    <div class="mt-6 grid grid-cols-5 gap-2">

        <div class="h-2 rounded-full bg-[#F2A15F]"></div>
        <div class="h-2 rounded-full bg-[#D88CB5]"></div>
        <div class="h-2 rounded-full bg-[#66B7C2]"></div>
        <div class="h-2 rounded-full bg-[#4E8BC9]"></div>
        <div class="h-2 rounded-full bg-[#F27C73]"></div>

    </div>

</div>

{% endblock %}
