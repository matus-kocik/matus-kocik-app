{% extends "base.html" %}

{% block content %}
<div class="max-w-5xl xl:max-w-6xl mx-auto px-4 mt-6">
    {% if post.image %}
        <div class="w-full mb-6 relative">
            <img src="{{ post.image.url }}"
                class="w-full max-h-[500px] object-cover rounded-2xl" />
            <div class="absolute inset-0 bg-black/20 rounded-2xl"></div>
        </div>
    {% endif %}
    <div class="bg-[#254E70] border border-white/10 rounded-3xl p-6 shadow-xl shadow-black/40">
        <a href="{% url 'post_list' %}" class="text-sm text-white/60 hover:text-white mb-6 inline-block">
            ← Späť na blog
        </a>

        <h1 class="text-3xl md:text-4xl font-bold text-[#EDAE49] mb-4 max-w-3xl mx-auto">
            {{ post.title }}
        </h1>

        <p class="text-sm text-white/60 mb-8 max-w-3xl mx-auto">
            {{ post.created_at|date:"d.m.Y" }}
        </p>

        <div class="prose max-w-3xl mx-auto prose-invert text-white/90 mt-6 
            leading-relaxed 
            prose-p:mb-6 prose-p:text-xl
            prose-headings:mt-10 prose-headings:mb-5 
            prose-h2:text-3xl prose-h2:font-bold 
            prose-h3:text-2xl prose-h3:font-semibold
            [&_ul]:list-disc [&_ul]:ml-6 [&_ul]:mb-6 
            [&_ol]:list-decimal [&_ol]:ml-6 [&_ol]:mb-6">
            {{ post.content|safe }}
        </div>
    </div>
</div>
{% endblock %}
