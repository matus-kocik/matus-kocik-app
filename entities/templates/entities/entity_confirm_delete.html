{% extends "base.html" %}

{% block content %}

<div class="flex min-h-screen items-center justify-center bg-white p-6">

    <div class="w-full max-w-md">

        <!-- DELETE CARD -->
        <div
            class="
                rounded-3xl
                border border-[#F27C73]
                bg-[#FCEAE7]
                p-8
                text-center
                shadow-sm
            "
        >

            <h1
                class="
                    mb-4
                    text-2xl
                    font-bold
                    text-[#F27C73]
                "
            >
                Zmazať subjekt
            </h1>


            <p
                class="
                    mb-8
                    text-[#4E8BC9]
                "
            >
                Naozaj chceš zmazať subjekt

                <span class="font-bold text-[#F27C73]">
                    {{ object.name }}
                </span>

                ?
            </p>


            <form
                method="post"
                class="
                    flex
                    items-center
                    justify-center
                    gap-4
                "
            >

                {% csrf_token %}


                <!-- DELETE -->
                <button
                    type="submit"
                    class="btn-danger"
                >
                    Áno, zmazať
                </button>


                <!-- CANCEL -->
                <a
                    href="{% url 'entities:entity_list' %}"
                    class="btn-secondary"
                >
                    Nie, späť
                </a>

            </form>

        </div>


        <!-- COLOR PALETTE -->
        <div class="mt-6 grid grid-cols-5 gap-2">

            <div class="h-2 rounded-full bg-[#F2A15F]"></div>
            <div class="h-2 rounded-full bg-[#D88CB5]"></div>
            <div class="h-2 rounded-full bg-[#66B7C2]"></div>
            <div class="h-2 rounded-full bg-[#4E8BC9]"></div>
            <div class="h-2 rounded-full bg-[#F27C73]"></div>

        </div>

    </div>

</div>

{% endblock %}
